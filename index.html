<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwoAbod - سوو عبود الصوتية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f0c1b',
                            card: '#18132a',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                            gold: '#f59e0b',
                            accent: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f0c1b;
            color: #ffffff;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }
        .glow-gold {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #18132a;
        }
        ::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen flex flex-col justify-between overflow-x-hidden pb-16">

    <!-- Header Navigation -->
    <header class="bg-brand-card sticky top-0 z-40 border-b border-purple-900/40 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="relative cursor-pointer" onclick="openProfileModal()">
                <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="w-10 h-10 rounded-full border-2 border-brand-purple object-cover">
                <span class="absolute -bottom-1 -right-1 bg-brand-gold text-xs px-1 text-black font-bold rounded-full border border-black" id="user-badge">
