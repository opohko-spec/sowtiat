<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sowtiat - منصة الغرف الصوتية</title>
    <!-- مكتبة جيتسي الخارجية للغرف الحية -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* واجهة قائمة الغرف (Lobby) */
        #lobby-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .header-title {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .header-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* واجهة الغرفة النشطة */
        #room-container {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #jitsi-iframe {
            width: 100%;
            height: 100%;
        }

        .leave-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }

        .btn-leave {
            background-color: #ef4444;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-leave:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية: دخول وإنشاء الغرف -->
    <div id="lobby-container">
        <h1 class="header-title">منصة Sowtiat</h1>
        <p class="header-subtitle">انضم لغرفة حية أو أنشئ غرفتك الصوتية الآن</p>

        <div class="card">
            <div class="input-group">
                <label for="username-input">اسمك في الغرفة:</label>
                <input type="text" id="username-input" class="input-control" placeholder="أدخل اسمك هنا..." value="عضو_صوتيات">
            </div>

            <div class="input-group">
                <label for="room-input">اسم الغرفة الصوتية:</label>
                <input type="text" id="room-input" class="input-control" placeholder="مثال: Abod_Room" value="Sowtiat_Live_1">
            </div>

            <button class="btn" onclick="joinRoom()">دخول الغرفة الحية</button>
        </div>
    </div>

    <!-- شاشة البث المباشر للغرفة -->
    <div id="room-container">
        <div class="leave-bar">
            <button class="btn btn-leave" onclick="leaveRoom()">الخروج من الغرفة</button>
        </div>
        <div id="jitsi-iframe"></div>
    </div>

    <script>
        let api = null;

        function joinRoom() {
            const username = document.getElementById('username-input').value.trim() || 'عضو';
            const roomName = document.getElementById('room-input').value.trim() || 'Sowtiat_Default';

            // إخفاء اللوبي وإظهار شاشة الغرفة
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('room-container').style.display = 'block';

            const domain = 'meet.jit.si';
            const options = {
                roomName: 'Sowtiat_' + roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-iframe'),
                userInfo: {
                    displayName: username
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true, // تفعيل وضع الصوت افتراضياً
                    disableThirdPartyRequests: true,
                    enableWelcomePage: false
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'chat', 'raisehand',
                        'tileview', 'hangup', 'settings', 'participants-pane'
                    ]
                }
            };

            // تشغيل محرك الغرف الصوتية
            api = new JitsiMeetExternalAPI(domain, options);

            // عند الخروج من الغرفة عبر زر Hangup في جيتسي
            api.addEventListeners({
                videoConferenceLeft: function () {
                    leaveRoom();
                }
            });
        }

        function leaveRoom() {
            if (api) {
                api.dispose();
                api = null;
            }
            // إرجاع الواجهة للشاشة الرئيسية
            document.getElementById('room-container').style.display = 'none';
            document.getElementById('jitsi-iframe').innerHTML = '';
            document.getElementById('lobby-container').style.display = 'flex';
        }
    </script>
</body>
</html>
