<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwoAbod - سوو عبود</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f0c1b; color: #ffffff; }
    </style>
</head>
<body class="bg-[#0f0c1b] min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-md mx-auto w-full space-y-4">
        <!-- Header -->
        <div class="bg-[#18132a] p-4 rounded-2xl border border-purple-900/50 flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="w-12 h-12 rounded-full border-2 border-purple-500 object-cover">
                <div>
                    <h2 class="font-bold text-sm">عبود المالك</h2>
                    <span class="text-xs bg-purple-950 text-purple-300 px-2 py-0.5 rounded-full">#ABOD99 • مدير</span>
                </div>
            </div>
            <div class="text-amber-400 font-bold text-xs flex items-center gap-1 bg-amber-500/10 px-3 py-1.5 rounded-xl border border-amber-500/30">
                <i class="fa-solid fa-coins"></i> 50,000
            </div>
        </div>

        <!-- Main Banner -->
        <div class="bg-gradient-to-r from-purple-900 to-indigo-900 rounded-2xl p-5 text-center shadow-xl border border-purple-500/30 space-y-3">
            <h3 class="font-bold text-base text-white">مرحباً بك في تطبيق SwoAbod 🎙️</h3>
            <p class="text-xs text-purple-200">المنصة الصوتية المتكاملة للغرف والدردشة والدعم</p>
            <button onclick="alert('أهلاً بك يا عبود، المنصة تعمل بكفاءة تامة!')" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-xs px-6 py-2.5 rounded-xl shadow-lg">
                دخول الغرف الصوتية
            </button>
        </div>

        <!-- Rooms List -->
        <div class="space-y-2">
            <h4 class="font-bold text-xs text-purple-300">الغرف النشطة حالياً:</h4>
            <div class="bg-[#18132a] p-3 rounded-xl border border-purple-900/40 flex justify-between items-center">
                <div>
                    <h5 class="font-bold text-xs">روم عبود وسوماتش الرسمي 🔥</h5>
                    <span class="text-[10px] text-emerald-400">18 متواجد الآن</span>
                </div>
                <button onclick="alert('جاري الدخول إلى الروم الصوتية...')" class="bg-purple-600/20 text-purple-300 text-xs px-3 py-1.5 rounded-lg border border-purple-600/40 font-bold">
                    دخول
                </button>
            </div>
        </div>
    </div>
</body>
</html>
