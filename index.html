<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwoAbod - سوو عبود الصوتية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f0c1b',
                            card: '#18132a',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                            gold: '#f59e0b',
                            accent: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f0c1b;
            color: #ffffff;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }
        .glow-gold {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #18132a;
        }
        ::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 10px;
        }
    </style>
</head>

    <!-- Header Navigation -->
    <header class="bg-brand-card sticky top-0 z-40 border-b border-purple-900/40 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="relative cursor-pointer" onclick="switchTab('profile')">
                <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="w-10 h-10 rounded-full border-2 border-brand-purple object-cover">
                <span class="absolute -bottom-1 -right-1 bg-brand-gold text-[9px] px-1 text-black font-black rounded-full border border-black" id="user-badge">مدير</span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span id="user-name" class="font-bold text-xs">عبود المالك</span>
                    <span id="user-id" class="text-[10px] bg-purple-950 text-purple-300 px-2 py-0.5 rounded-full border border-purple-800">#ABOD99</span>
                </div>
                <div class="flex items-center gap-1 text-xs text-brand-gold mt-0.5">
                    <i class="fa-solid fa-coins text-[10px]"></i>
                    <span id="user-coins" class="font-bold text-xs">50,000</span>
                    <button onclick="switchTab('store')" class="mr-1 bg-brand-gold/20 hover:bg-brand-gold/40 text-brand-gold text-[9px] px-1.5 py-0.5 rounded-full border border-brand-gold/40 font-bold transition">شحن +</button>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="openAdminPanel()" class="bg-gradient-to-r from-amber-500 to-red-600 text-white font-bold text-xs px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1 border border-amber-300/40 glow-gold">
                <i class="fa-solid fa-crown text-xs"></i>
                الدارة
            </button>
            <button onclick="switchTab('rooms')" class="text-gray-300 hover:text-white p-2">
                <i class="fa-solid fa-compass text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-3 max-w-md mx-auto w-full">

        <!-- TAB 1: ROOMS LIST -->
        <section id="tab-rooms" class="space-y-4">
            <div class="relative">
                <input type="text" placeholder="إبحث عن غرفة صوتية أو أيدي..." class="w-full bg-brand-card text-xs rounded-xl py-2.5 px-4 pr-10 border border-purple-900/50 focus:outline-none focus:border-brand-purple">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-gray-400 text-xs"></i>
            </div>
